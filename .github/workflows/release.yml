name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even if the tag already exists
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/scele/__init__.py)
          [ -n "$version" ] || { echo "::error::could not read __version__"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released — skipping"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version has no tag yet — releasing"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-latest
            archive: tar.gz
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            archive: tar.gz
          - target: macos-arm64
            runs-on: macos-14
            archive: tar.gz
          - target: windows-x86_64
            runs-on: windows-latest
            archive: zip
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[build,tui]"
      - name: Build onedir bundle
        run: python -m PyInstaller packaging/scele.spec --clean --noconfirm --distpath dist --workpath build/pyinstaller
      - name: Smoke test
        shell: bash
        run: |
          bin=dist/scele/scele
          [ "${{ matrix.archive }}" = zip ] && bin=dist/scele/scele.exe
          "$bin" --version
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf "scele-${{ matrix.target }}.tar.gz" -C dist scele
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/scele -DestinationPath "scele-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: scele-${{ matrix.target }}.*
          if-no-files-found: error

  pydist:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build
      - uses: actions/upload-artifact@v4
        with:
          name: pydist
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, build, pydist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true
      - name: Assemble release assets
        run: |
          mkdir -p release
          mv staging/* release/
          cd release
          sha256sum \
            scele-linux-x86_64.tar.gz \
            scele-linux-aarch64.tar.gz \
            scele-macos-arm64.tar.gz \
            scele-windows-x86_64.zip \
            > checksums.txt
          cat checksums.txt
      - name: Tag v${{ needs.check.outputs.version }}
        run: |
          git tag "v${{ needs.check.outputs.version }}"
          git push origin "v${{ needs.check.outputs.version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
